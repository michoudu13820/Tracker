# Configuration Netlify — hébergement statique de la PWA + micro-scheduler Web Push.
# Voir docs/architecture/ADR-001.

[build]
  # SvelteKit adapter-static publie l'app dans `build/`.
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  # Node 20 reached end-of-life on 2026-04-30. Kept in sync with `node-version` in
  # .github/workflows/ci.yml (the actual production build runs there, via `netlify deploy`).
  NODE_VERSION = "24"

# La planification de `send-reminders` est déclarée dans le fichier de la fonction
# (export `config.schedule`). Elle peut aussi être surchargée ici si besoin :
# [functions."send-reminders"]
#   schedule = "*/15 * * * *"

# SPA fallback : toute route inconnue sert l'app shell (routage côté client).
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
