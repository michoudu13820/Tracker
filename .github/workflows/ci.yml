name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SvelteKit's `$env/static/public` requires PUBLIC_* vars to be defined at build time
    # (see docs/architecture/ARCHITECTURE.md). CI only needs the module to resolve for
    # typecheck/build to succeed — these are non-secret placeholders, NOT the real VAPID
    # key. The real value is set as a Netlify environment variable for production builds.
    env:
      PUBLIC_VAPID_KEY: 'ci-placeholder-not-a-real-key'
      PUBLIC_SCHEDULER_URL: '/.netlify/functions'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      # No-op if "lint" is not (yet) defined in package.json scripts.
      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build (adapter-static)
        run: npm run build
